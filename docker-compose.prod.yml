# ─────────────────────────────────────────────────────────────────────────────
# PRODUCTION — the API, built the way a deployed host builds it.
#
#   cp apps/api/.env.prod.example apps/api/.env.prod   # then edit it
#   docker compose -f docker-compose.prod.yml up -d --build
#
# There is no `mongo` service here. MongoDB is Atlas-hosted in every environment
# (docs/decision-log.md, 2026-09-23) — apps/api/.env.prod's MONGO_URI is an Atlas connection
# string, and the deploy host's egress IP must be allowlisted on that Atlas project first; see
# docs/manual_deploy.md.
#
# `web` is the Next.js admin portal. NEXT_PUBLIC_API_BASE_URL is a BUILD arg (inlined into the
# browser bundle), read from the root .env at compose time — set it before `up --build`.
# The portal and the API must share a registrable domain (e.g. app.example.com and
# api.example.com): the refresh cookie is SameSite=Strict, so a different site would never send it.
#
# On a real host, nginx terminates TLS in front of api:3000 and web:3001 — see
# docs/engineering/build-and-deploy.md.
# ─────────────────────────────────────────────────────────────────────────────

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: [apps/api/.env.prod]
    ports: ['3000:3000']
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?set NEXT_PUBLIC_API_BASE_URL in .env}
        # Optional browser key for the route map; unset => the map shows a fallback message.
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    ports: ['3001:3001']
    depends_on: [api]
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/login']
      interval: 15s
      timeout: 5s
      retries: 5
