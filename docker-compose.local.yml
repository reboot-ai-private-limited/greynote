# Local MongoDB for development and rehearsing data scripts. Nothing here talks to Atlas.
#
#   docker compose -f docker-compose.local.yml up -d
#   MONGO_URI=mongodb://127.0.0.1:27018/greynotenew     (apps/api/.env.local; `pnpm --filter @greynote/api dev:local`)
#
# Only the database runs in Docker: the API runs natively with tsx, which costs far less memory than an image
# on a small machine. Bound to 127.0.0.1 only, on 27018 so it never collides with another project's Mongo on 27017.
# Memory is capped: WiredTiger's cache is limited to 0.25 GB and the container to 512 MB.
services:
  greynote-local:
    image: mongo:7
    container_name: greynote-local
    command: ["mongod", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - greynote-local-data:/data/db
    mem_limit: 512m
    restart: unless-stopped

volumes:
  greynote-local-data:
